services:
 - type: web
   name: qcircuitlab-api
   runtime: python
   plan: free
   buildCommand: "pip install -r backend/requirements.txt"
   startCommand: "cd backend && uvicorn backend_main:app --host 0.0.0.0 --port $PORT"
   healthCheckPath: /health
   envVars:
     -  key: ANTHROPIC_API_KEY
        sync: false
